<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="formulario">

        <h1>Registro de Usuario</h1>

        <form action="#" method="post">

            <label for="username">Nombre de usuario:</label>
            <input type="text" id="username" name="username" placeholder="Escribe tu nombre de usuario" required>

            <label for="document">Documento:</label>
            <input type="text" id="document" name="document" placeholder="Escribe tu documento" required>

            <label for="address">Dirección:</label>
            <input type="text" id="address" name="address" placeholder="Escribe tu dirección" required>

            <label for="phone">Teléfono:</label>
            <input type="text" id="phone" name="phone" placeholder="Escribe tu teléfono" required>

            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" placeholder="Escribe tu contraseña" required>

            <button type="submit">Registrar</button>

        </form>

        <p>
            ¿Ya tienes una cuenta?
            <a href="inicio.html">Iniciar sesión</a>
        </p>

    </div>

</body>

</html>
